<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="PieceSpice — High-Fidelity Piecewise SPICE Modeling Framework">
  <defs>
    <!-- Deep slate card background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1324"/>
    </linearGradient>

    <!-- Title & primary accent gradient (amber -> gold -> cyan) -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Bold emblem gradients -->
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="shard-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="shard-ice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="die-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="die-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Trace fade gradients -->
    <linearGradient id="cyan-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="amber-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.48"/>
    </linearGradient>

    <!-- Dual-tone ambient glows -->
    <radialGradient id="glow-left" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-right" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle glow filter for the emblem mark -->
    <filter id="mark-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#fbbf24" flood-opacity="0.35"/>
    </filter>

    <!-- Subtle engineering dot grid -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#94a3b8" fill-opacity="0.09"/>
    </pattern>

    <clipPath id="card-clip">
      <rect x="1" y="1" width="1198" height="238" rx="16"/>
    </clipPath>
  </defs>

  <!-- Outer card frame -->
  <rect x="1" y="1" width="1198" height="238" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5"/>

  <g clip-path="url(#card-clip)">
    <!-- Background grid & ambient lighting -->
    <rect x="0" y="0" width="1200" height="240" fill="url(#dot-grid)"/>
    <circle cx="178" cy="120" r="190" fill="url(#glow-left)"/>
    <circle cx="1080" cy="110" r="220" fill="url(#glow-right)"/>

    <!-- Top hairline accent -->
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent-grad)" opacity="0.9"/>

    <!-- Subtle 45-degree chamfered PCB / SPICE bus traces on right -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 800 58 L 940 58 L 976 94 L 1200 94" stroke="url(#cyan-fade)" stroke-width="1.75"/>
      <path d="M 850 82 L 928 82 L 964 118 L 1200 118" stroke="url(#cyan-fade)" stroke-width="1.5"/>
      <path d="M 820 144 L 950 144 L 986 180 L 1200 180" stroke="url(#amber-fade)" stroke-width="1.75"/>
      <path d="M 880 168 L 938 168 L 962 192 L 1200 192" stroke="url(#amber-fade)" stroke-width="1.25"/>
    </g>

    <!-- Crisp via pads on trace endpoints -->
    <g>
      <circle cx="940" cy="58" r="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.55"/>
      <circle cx="1065" cy="94" r="3.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
      <circle cx="1115" cy="118" r="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.65"/>
      <circle cx="1040" cy="180" r="3.5" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" opacity="0.65"/>
      <circle cx="1140" cy="192" r="2.8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- Bold Brand Emblem: Chamfered Silicon Die + Faceted Piecewise "P" / Switching Bolt -->
    <g transform="translate(116, 56)">
      <!-- Subtle QFN-style die pins (top/bottom/sides) -->
      <g fill="#38bdf8" opacity="0.35">
        <rect x="34" y="-5" width="12" height="5" rx="1.5"/>
        <rect x="58" y="-5" width="12" height="5" rx="1.5"/>
        <rect x="82" y="-5" width="12" height="5" rx="1.5"/>
        <rect x="34" y="128" width="12" height="5" rx="1.5"/>
        <rect x="58" y="128" width="12" height="5" rx="1.5"/>
        <rect x="82" y="128" width="12" height="5" rx="1.5"/>
      </g>
      <g fill="#fbbf24" opacity="0.35">
        <rect x="-5" y="34" width="5" height="12" rx="1.5"/>
        <rect x="-5" y="58" width="5" height="12" rx="1.5"/>
        <rect x="-5" y="82" width="5" height="12" rx="1.5"/>
        <rect x="128" y="34" width="5" height="12" rx="1.5"/>
        <rect x="128" y="58" width="5" height="12" rx="1.5"/>
        <rect x="128" y="82" width="5" height="12" rx="1.5"/>
      </g>

      <!-- Chamfered silicon die body -->
      <polygon points="18,0 110,0 128,18 128,110 110,128 18,128 0,110 0,18"
               fill="url(#die-bg)" stroke="url(#die-rim)" stroke-width="2"/>
      <!-- Inner recessed die frame -->
      <polygon points="22,8 106,8 120,22 120,106 106,120 22,120 8,106 8,22"
               fill="none" stroke="#94a3b8" stroke-opacity="0.14" stroke-width="1"/>

      <!-- Faceted Piecewise "P" + Switching Bolt Monogram -->
      <g filter="url(#mark-glow)">
        <!-- Piece 1: Left crisp vertical spine (ice-white) -->
        <polygon points="34,28 50,28 50,100 34,100" fill="url(#shard-ice)"/>
        <!-- Piece 2: Upper-right angled P-loop facet (cyan) -->
        <polygon points="50,28 84,28 96,42 96,56 76,68 50,68 50,54 74,54 80,48 80,44 74,40 50,40"
                 fill="url(#shard-cyan)"/>
        <!-- Piece 3: High-energy switching bolt slicing through the lower-right (amber-gold) -->
        <polygon points="72,56 94,56 78,76 96,76 62,106 70,84 54,84"
                 fill="url(#bolt-grad)"/>
      </g>
    </g>

    <!-- Title & Catchphrase -->
    <text x="276" y="122"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="64" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">
      Piece<tspan fill="url(#accent-grad)">Spice</tspan>
    </text>

    <text x="279" y="162"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="20" font-weight="500" letter-spacing="0.4" fill="#94a3b8">
      High-Fidelity Piecewise SPICE Modeling Framework
    </text>
  </g>
</svg>
