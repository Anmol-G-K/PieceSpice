[project]
name = "piecespice"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "polars>=1.43.2",
    "pyspice>=1.5",
    "rdp>=0.8",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "notebook>=7.6.1",
]
